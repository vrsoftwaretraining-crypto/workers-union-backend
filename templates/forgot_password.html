<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="card">
  <h1>{{ translate('forgot_password') }}</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('auth.forgot_password') }}">
    <div class="input-group"><input name="union_reg_no" placeholder="{{ translate('union_reg_no') }}" required></div>
    <div class="input-group"><input name="username" placeholder="{{ translate('username') }}" required></div>
    <button class="full" type="submit">Send reset link</button>
  </form>
  <p style="margin-top:14px;"><a href="{{ url_for('auth.login_page') }}">{{ translate('login') }}</a></p>
</div></body></html>
