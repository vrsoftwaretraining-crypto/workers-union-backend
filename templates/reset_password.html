<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="card">
  <h1>{{ translate('reset_password') }}</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
    <div class="input-group"><input type="password" name="new_password" placeholder="{{ translate('new_password') }}" required minlength="6"></div>
    <button class="full" type="submit">{{ translate('save') }}</button>
  </form>
</div></body></html>
